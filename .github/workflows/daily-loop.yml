name: Generate daily loop puzzle

# Separate from daily-puzzle.yml on purpose, so the existing workflow is
# untouched. Runs 20 minutes after it so the two don't push at the same
# moment, and can also be triggered by hand from the Actions tab.
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit loop-data.js back to the repo

jobs:
  build-loop-puzzle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Same key prefix as daily-puzzle.yml, so both workflows build on
      # one shared pool of cached TMDB responses.
      - name: Restore TMDB response cache
        uses: actions/cache@v4.2.0
        with:
          path: cache
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: |
            tmdb-cache-

      - name: Generate today's loop puzzle
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node daily-loop.js

      - name: Move output to repo root
        run: mv out/loop-data.js loop-data.js

      - name: Commit and push if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add loop-data.js

          if git diff --staged --quiet; then
            echo "No change to loop-data.js — nothing to commit."
            exit 0
          fi

          git commit -m "Daily loop puzzle: $(date -u +%Y-%m-%d)"

          # Only loop-data.js is touched here, so if main has moved (for
          # example the other daily workflow just pushed), replaying this
          # commit on top of it never conflicts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest main..."
            git pull --rebase origin main
          done

          echo "Failed to push after 5 attempts."
          exit 1