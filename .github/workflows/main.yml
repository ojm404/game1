name: Generate daily puzzle

# Runs once a day, plus you can trigger it manually from the Actions tab
# (useful for testing without waiting for the schedule).
on:
  schedule:
    # 06:00 UTC every day. Cron is always UTC on GitHub Actions — adjust
    # this number for your own timezone if you want the puzzle to flip
    # over at a specific local time (e.g. midnight Eastern in winter is
    # 05:00 UTC).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit puzzle-data.js back to the repo

jobs:
  build-puzzle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Restore TMDB response cache
        uses: actions/cache@v6
        with:
          path: cache
          # Every run saves under a unique key (github.run_id), so this
          # always creates a new cache entry — but restore-keys does a
          # prefix match and pulls in the MOST RECENT prior one first, so
          # each day builds on top of what every previous day already
          # fetched rather than starting from nothing. This accumulates
          # over time; GitHub evicts cache entries after 7 days unused or
          # once the repo's total cache storage hits its cap, whichever
          # comes first — nothing to manage manually either way.
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: |
            tmdb-cache-

      - name: Generate today's puzzle
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node daily-puzzle.js

      - name: Move output to repo root
        run: mv out/puzzle-data.js puzzle-data.js

      - name: Commit and push if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add puzzle-data.js

          if git diff --staged --quiet; then
            echo "No change to puzzle-data.js — nothing to commit."
            exit 0
          fi

          git commit -m "Daily puzzle: $(date -u +%Y-%m-%d)"

          # A manual run and the scheduled run can land close enough
          # together that main moves between this job's checkout and its
          # push — GitHub then rejects the push outright rather than risk
          # silently overwriting the other run's commit. Since
          # puzzle-data.js is fully regenerated every run, there's nothing
          # to actually merge: on a conflict, just take this run's version
          # and retry, rather than needing a human to resolve it.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — fetching latest and rebasing on top..."
            git fetch origin main
            git rebase origin/main -X ours
          done

          echo "Failed to push after 5 attempts."
          exit 1
